<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!--
    El logotipo en cuadrado: dos líneas que coinciden y en un punto se abren, más
    la cuña rellena entre ellas. Es la tesis del proyecto dibujada — la venta
    observada y la demanda latente separándose donde hubo quiebre.
  -->
  <rect width="120" height="120" fill="#FAF8F5" />
  <path d="M10 76 L54 76 L86 40 L112 40" fill="none" stroke="#8A8A84" stroke-width="9" />
  <path d="M10 76 L54 76 L112 76" fill="none" stroke="#1A1A18" stroke-width="9" />
  <path d="M54 76 L86 40 L112 40 L112 76 Z" fill="#D6451A" />
</svg>
