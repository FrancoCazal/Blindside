[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blindside"
version = "0.1.0"
description = "Pronostico de demanda de perecederos con recuperacion de demanda censurada y capa de decision de reposicion."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Franco Cazal" }]
keywords = ["forecasting", "censored-demand", "newsvendor", "conformal-prediction"]

# Las versiones fijas viven en requirements.txt (requisito del checklist M7).
# Aqui solo van los limites minimos necesarios para que el paquete instale.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dl = ["torch>=2.2"]
stats = ["statsmodels>=0.14", "statsforecast>=1.7"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PD"]
ignore = [
    "PD901", # permitir `df` como nombre de variable
    # Los tres alias de abajo son convencion del proyecto y estan en todos los
    # modulos: `schema as S`, `metrics as M`, `contracts as C`. Los nombres de
    # columna se referencian cientos de veces (`S.SERIES_ID`, `C.Y_PRED`), y un
    # alias de una letra los deja legibles sin ocupar media linea.
    "N812", # modulo importado con alias en mayuscula
    # `X` para la matriz de features e `y` para el target es la convencion
    # universal de scikit-learn. Renombrarlos a `x` volveria el codigo mas
    # extrano de leer para cualquiera que venga del ecosistema.
    "N803", # argumento en mayuscula
    "N806", # variable en mayuscula dentro de funcion
    # `nunique() > 1` es exactamente lo que se quiere en los asserts antifugas:
    # detectar si una feature varia dentro de un grupo. La alternativa que
    # sugiere la regla no expresa lo mismo.
    "PD101",
    # `pivot` es preferible a `pivot_table` en este proyecto, al revés de lo que
    # sugiere la regla. Hay exactamente un valor por (origen, modelo): si
    # apareciera un duplicado, `pivot` falla y `pivot_table` promediaría en
    # silencio. Se quiere el que falla.
    "PD010",
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402"]
# Los tests acceden a helpers privados a proposito: `cal._easter` se verifica
# contra fechas conocidas porque un algoritmo de Pascua mal implementado no falla
# de forma visible en ningun otro lugar.
"tests/*" = ["SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests que entrenan modelos o leen el dataset completo",
    "leakage: tests antifugas de la seccion de validacion",
]
